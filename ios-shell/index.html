<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Peace of Mine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #faf8f5;
        color: #4a4038;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wrap {
        padding: 2rem;
      }
      .dot {
        width: 10px;
        height: 10px;
        margin: 0 auto 1rem;
        border-radius: 50%;
        background: #8a9a7b;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      p {
        font-size: 0.9rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <!--
      Native shell fallback. The iOS app loads the hosted app defined by
      server.url in capacitor.config.ts; this page only shows if the device
      can't reach it (offline / first paint).
    -->
    <div class="wrap">
      <div class="dot"></div>
      <p>Connecting to Peace of Mine…<br />Check your internet connection.</p>
    </div>
  </body>
</html>
